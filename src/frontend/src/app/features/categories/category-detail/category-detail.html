<div class="view">
  <nav class="breadcrumb">
    <a routerLink="/categories">Categories</a>
    <span>/</span>
    <span>{{ category() }}</span>
  </nav>

  <app-filter-sort-bar
    defaultSort="Newest"
    defaultDirection="Desc"
    [showLanguageFilter]="false"
    [forcedCategory]="category()"
    [licenseOptions]="(facetOptions.licenseOptions$ | async) ?? []"
    [topicOptions]="(facetOptions.topicOptions$ | async) ?? []"
    (stateChange)="onFilterStateChange($event)"
  />

  <app-repository-grid
    [items]="items()"
    [loading]="loading()"
    [error]="error()"
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    (pageChange)="onPageChange($event)"
    (retry)="onRetry()"
    (clearFilters)="onClearFilters()"
  />
</div>
