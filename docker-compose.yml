# Self-hosted deployment (ADR-002): app + PostgreSQL via Compose; LM Studio runs host-installed,
# not as a container (ADR-016) - the operator already runs it natively, and containerizing a
# second copy would lose GPU/Metal acceleration and depend on an unstable preview image for no
# benefit. Run `make up` (see repo-root Makefile) instead of `docker compose up` directly - it
# checks Docker is running, brings this file up, then checks/starts LM Studio and loads the
# configured model on the host before the stack is actually ready to serve summaries.
#
# The app container is the single deployable process (API + served Angular dashboard, ADR-002 /
# ADR-008) - there is deliberately no separate dashboard container.
#
# Required environment: every ${VAR:?...} guard below (see .env.example, docs/setup.md). Compose
# reads a `.env` file in this directory automatically. `.env.example` is the single source of truth
# for every default (POSTGRES_DB/USER/PORT, LMSTUDIO_PORT/IDENTIFIER) - copying it to `.env` already
# fills all of them in, so in practice only POSTGRES_PASSWORD and GITHUB_TOKEN need real values
# typed in by hand. Nothing here re-hardcodes its own fallback for a value .env.example already
# defaults, precisely so there's only one place to update if a default ever needs to change.

services:
  app:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    # Bound to 127.0.0.1, not 0.0.0.0: the Hangfire dashboard at /hangfire runs without
    # authorization (see Program.cs's UseHangfireDashboard comment) and can trigger, delete, and
    # re-queue jobs, so publishing it on every host interface would hand pipeline control to
    # anyone on the same network. The operator reaches it from the host either way; nothing off-box
    # needs it. Put it behind an authenticating reverse proxy if remote access is ever wanted.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Host is "postgres" - the Compose service's internal DNS name - not env-driven, since it's
      # container-network topology, not user config. Port is always the container's own 5432, not
      # the host-published POSTGRES_PORT below (that's for host-side clients only).
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env - see .env.example};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env - see .env.example};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      GitHub__Token: "${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env}"
      # host.docker.internal is Docker Desktop's built-in alias for the host machine (Windows/macOS).
      # On Linux, Docker Desktop isn't in play the same way - the extra_hosts entry below maps the
      # same alias to the host gateway so this works identically across platforms without an
      # OS-specific override here.
      LmStudio__BaseUrl: "http://host.docker.internal:${LMSTUDIO_PORT:?Set LMSTUDIO_PORT in .env - see .env.example}"
      # Must match the identifier `make up`/`lms load --identifier` assigns the loaded model (see
      # Makefile's LMSTUDIO_IDENTIFIER) - this is the fixed alias, not the catalog model name.
      LmStudio__Model: "${LMSTUDIO_IDENTIFIER:?Set LMSTUDIO_IDENTIFIER in .env - see .env.example}"
      # F-013 daily digest. Unguarded (no ${VAR:?...}) unlike everything above: blank is a valid
      # value here - SendDigestCommandHandler/SmtpEmailSender both check and skip with a warning
      # rather than failing, so an operator who doesn't want the email just leaves these empty in
      # .env. Without these lines the digest could never send in this deployment no matter what
      # .env said, because appsettings.json ships them blank and only appsettings.Development.json
      # (Mailpit, `make dev` only) fills them in. The `-` in ${VAR-} is an empty default for the
      # unset case only, so an .env written before these existed doesn't warn on every `make up`;
      # it duplicates no real default, because blank is what "not configured" already means.
      Smtp__Host: "${SMTP_HOST-}"
      Smtp__Port: "${SMTP_PORT-}"
      Smtp__Username: "${SMTP_USERNAME-}"
      Smtp__Password: "${SMTP_PASSWORD-}"
      Smtp__EnableSsl: "${SMTP_ENABLE_SSL-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS-}"
      Digest__RecipientEmail: "${DIGEST_RECIPIENT_EMAIL-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env - see .env.example}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env - see .env.example}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    # Published so a local DB client (or the app running bare via `dotnet run`, see Program.cs) can
    # reach Postgres from the host - the app container itself never uses this, it talks over the
    # internal Compose network via the "postgres" hostname/5432 above.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env - see .env.example}:5432"
    # PostgreSQL 18+ images store data in a major-version-specific subdirectory under
    # /var/lib/postgresql (not directly at /var/lib/postgresql/data as in older images) - mounting
    # the volume at /var/lib/postgresql/data breaks startup. Verified live against postgres:18.4.
    #
    # Bind-mounted to a local repo-root folder (./data/postgres) rather than a named Docker
    # volume, so the data survives `docker compose down` (no accidental loss to `-v`/`docker
    # volume prune`) and stays visible/backup-able as plain files on the host instead of living
    # inside Docker's opaque volume storage. Git-ignored (see .gitignore) - this is runtime data,
    # not source.
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env - see .env.example} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env - see .env.example}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # SMTP capture tool for F-013 (Digest Service) testing - see appsettings.Development.json's Smtp
  # section and docs/setup.md §3a. Mailpit is the actively-maintained successor to MailHog (which
  # has had no meaningful releases since 2022) - same catch-all SMTP server + web UI to inspect
  # what got "sent" idea, still developed. Not part of the self-hosted deployment ADR-002
  # describes (app + postgres, LM Studio host-installed) - it exists so digest emails have
  # somewhere to land without a real mailbox.
  #
  # Started by both `make up` and `make dev`: it used to sit behind `profiles: ["dev"]` so only
  # `make dev` started it, which meant `make up` had no SMTP target at all - the digest job ran
  # daily, found nothing configured, and skipped. Point .env's SMTP_HOST at `mailpit` (the Compose
  # DNS name, not localhost - inside the app container localhost is the app itself) with
  # SMTP_PORT=1025 and SMTP_ENABLE_SSL=false to capture the digest here instead of sending it to a
  # real provider.
  #
  # Unpinned (`latest`), unlike postgres above: what it stores is disposable captured mail, not
  # production data, and a breaking image update is immediately visible in a tool whose whole job is
  # to be looked at - the pinning discipline that matters for data durability doesn't buy anything
  # here.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      # Without MP_DATA_FILE Mailpit keeps everything in memory, so `make down`/`make up` - or any
      # rebuild - silently discards whatever digests had been captured. Bind-mounted to a repo-root
      # folder for the same reasons postgres above is (visible as plain files, safe from
      # `docker volume prune`); git-ignored.
      MP_DATA_FILE: /data/mailpit.db
    volumes:
      - ./data/mailpit:/data
    ports:
      - "127.0.0.1:1025:1025" # SMTP - matches appsettings.Development.json's Smtp:Port
      - "127.0.0.1:8025:8025" # Web UI - http://localhost:8025 to see captured digest emails
